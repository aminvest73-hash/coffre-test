<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Faux jeu (démonstration)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Faux jeu</h1>
  <p class="muted">Ceci n'est pas un vrai jeu. Il sert à essayer « Se connecter » (avec des clés jetables) et « Connecter mon wallet ».</p>

  <section class="card">
    <h2 id="titre">Bienvenue</h2>
    <p id="etat">Pour jouer, connecte-toi avec ton coffre, ou avec le wallet que tu as déjà.</p>
    <button id="b-connexion">Se connecter</button>
    <button id="b-existant" class="second">J'ai déjà mon coffre</button>
    <div class="ou" aria-hidden="true">ou</div>
    <!-- Pour le joueur qui a déjà un wallet Solana. L'icône est dessinée ici : rien n'est chargé d'ailleurs. -->
    <button id="b-wallet" class="second porte"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7.5V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H6a2 2 0 0 1-2-1.5zm0 0A2 2 0 0 1 6 5h11v4"/><circle cx="16.5" cy="14" r="1.3" fill="currentColor"/></svg><span>Connecter mon wallet</span></button>
    <div id="z-wallets" hidden>
      <p class="muted">Plusieurs wallets sont installés. Lequel veux-tu utiliser ?</p>
      <div id="l-wallets"></div>
    </div>
    <div class="status" id="s-jeu"></div>
  </section>

  <section class="card">
    <h2>Pour l'essai</h2>
    <button id="b-copier" class="second">Copier le résultat</button>
    <textarea id="resultat" readonly></textarea>
    <div class="status" id="s-resultat"></div>
  </section>
</main>
<script type="module" src="demo.mjs"></script>
</body>
</html>
