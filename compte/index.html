<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://coffre-serveur-test.aminvest73.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<title></title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Aucun texte pour le joueur n'est écrit ici : la page les pose elle-même, en français ou en anglais (textes.mjs).
     Seul le relevé d'essai, tout en bas, reste écrit en français. -->
<main>
  <header class="entete">
    <svg class="marque" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
      <rect class="porte" x="3" y="3" width="34" height="34" rx="10"/>
      <circle class="cadran" cx="20" cy="20" r="8"/>
      <path class="cadran" d="M20 12v3.5M20 24.5V28M12 20h3.5M24.5 20H28"/>
    </svg>
    <h1 id="t-titre"></h1>
    <div class="langue" role="group" id="z-langue">
      <button type="button" id="b-langue-fr"></button><button type="button" id="b-langue-en"></button>
    </div>
  </header>
  <p class="muted essai-note" id="t-essai"></p>
  <div class="status ko" id="blocage" hidden></div>

  <section class="card" id="v-admission" hidden>
    <h2 id="t-adm-titre"></h2>
    <p class="muted" id="t-adm-texte"></p>
    <input id="code-testeur" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="b-code"></button>
    <div class="status" id="s-admission"></div>
  </section>

  <!-- Un jeu demande de confirmer un envoi ou une opération : la page montre qui demande, ce qui sortirait du wallet,
       ce qu'elle a vérifié et ce qu'elle ne lit pas. Rien d'autre n'est proposé pendant ce temps. -->
  <section class="card jeu" id="v-operation" hidden>
    <h2 id="op-titre"></h2>
    <p><strong id="op-nom"></strong> <span id="op-phrase"></span></p>
    <p class="site" id="op-site"></p>
    <div class="envoi" id="op-sorties"></div>
    <p class="muted detail-envoi" id="op-destinataires"></p>
    <p class="faits-operation" id="op-faits"></p>
    <p class="muted" id="op-frais"></p>
    <p class="total-envoi" id="op-total"></p>
    <!-- Pour une opération du programme d'un jeu : ce que la fenêtre a vérifié, et ce qu'elle ne lit pas. -->
    <p class="muted note-operation" id="op-limite" hidden></p>
    <button id="b-op-confirmer" hidden></button>
    <button id="b-op-refuser" class="second" hidden></button>
    <div class="status" id="s-operation"></div>
  </section>

  <!-- Un jeu demande à connecter le joueur : son nom, son site, ce qu'il verra. Quand il n'y a pas encore de compte
       ici, cette carte et celle de l'accueil, juste en dessous, n'en font qu'une à l'écran. -->
  <section class="card jeu" id="v-jeu" hidden>
    <h2 id="jeu-titre"></h2>
    <p class="site" id="jeu-site"></p>
    <p class="muted" id="jeu-texte"></p>
    <button id="b-jeu" hidden></button>
    <div class="status" id="s-jeu"></div>
    <button id="b-jeu-refus" class="lien" hidden></button>
  </section>

  <div id="v-accueil" hidden>
    <section class="card">
      <h2 id="accueil-titre"></h2>
      <p class="muted" id="p-accueil"></p>
      <div id="z-portes" hidden>
        <!-- Les logos sont les fichiers officiels de chaque service, servis par cette page (voir LOGOS.md) : rien n'est chargé d'ailleurs. -->
        <button id="b-porte-google" class="porte porte-google" hidden><img src="google-g.svg" alt="" width="20" height="20"><span id="t-porte-google"></span></button>
        <button id="b-porte-discord" class="porte porte-discord" hidden><img src="discord-symbole-blanc.svg" alt="" width="20" height="20"><span id="t-porte-discord"></span></button>
        <button id="b-porte-email" class="porte porte-neutre" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3.5 6.5h17v11h-17z M4 7l8 6.5L20 7"/></svg><span id="t-porte-email"></span></button>
      </div>
      <div id="z-identite" hidden>
        <p class="muted" id="p-identite"></p>
        <input id="email" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false">
        <button id="b-envoyer-code"></button>
        <div id="z-code" hidden>
          <input id="code-email" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          <button id="b-valider-code"></button>
        </div>
      </div>
      <button id="b-creer"></button>
      <!-- Seulement quand le jeu qui a ouvert cette fenêtre le propose. Ce bouton ne signe rien et n'appelle aucun
           wallet : il rend la main au jeu. L'icône est dessinée ici : rien n'est chargé d'ailleurs. -->
      <button id="b-wallet" class="porte porte-neutre" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7.5V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H6a2 2 0 0 1-2-1.5zm0 0A2 2 0 0 1 6 5h11v4"/><circle cx="16.5" cy="14" r="1.3" fill="currentColor"/></svg><span id="t-wallet"></span></button>
      <p class="muted note" id="p-wallet" hidden></p>
      <div class="status" id="s-accueil"></div>
      <button id="b-connecter" class="lien"></button>
      <button id="b-retrouver" class="lien" hidden></button>
    </section>
    <p class="muted pied" id="a-pied"></p>
  </div>

  <!-- Retrouver son compte sans appareil, en trois étapes : l'adresse e-mail et son code, les 12 mots, le nouvel appareil. -->
  <section class="card" id="v-retrouver" hidden>
    <div class="pas" aria-hidden="true"><i id="r-pas-1"></i><i id="r-pas-2"></i><i id="r-pas-3"></i></div>
    <p class="muted etape" id="r-etape"></p>
    <div id="r-email">
      <h2 id="t-r-email-titre"></h2>
      <p class="muted" id="t-r-email-texte"></p>
      <div id="r-z-adresse">
        <input id="r-adresse" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false">
        <button id="b-r-code"></button>
      </div>
      <input id="r-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" hidden>
      <button id="b-r-valider" hidden></button>
      <p class="muted note" id="t-r-meme-compte"></p>
    </div>
    <div id="r-mots" hidden>
      <h2 id="t-r-mots-titre"></h2>
      <p class="muted" id="t-r-mots-texte"></p>
      <div class="saisie">
        <input id="r-mot-1" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="1">
        <input id="r-mot-2" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="2">
        <input id="r-mot-3" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="3">
        <input id="r-mot-4" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="4">
        <input id="r-mot-5" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="5">
        <input id="r-mot-6" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="6">
        <input id="r-mot-7" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="7">
        <input id="r-mot-8" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="8">
        <input id="r-mot-9" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="9">
        <input id="r-mot-10" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="10">
        <input id="r-mot-11" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="11">
        <input id="r-mot-12" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="12">
      </div>
      <button id="b-r-retrouver"></button>
      <button id="b-r-aide" class="lien"></button>
    </div>
    <div id="r-garder" hidden>
      <h2 id="t-r-garder-titre"></h2>
      <p class="muted" id="t-r-adresse"></p>
      <p class="adresse" id="r-wallet"></p>
      <p id="t-r-garder-texte"></p>
      <p class="fort" id="t-r-portee"></p>
      <p class="muted" id="t-r-ancien"></p>
      <button id="b-r-garder"></button>
    </div>
    <div class="status" id="s-retrouver"></div>
    <p class="muted note" id="r-suite"></p>
    <button id="b-r-annuler" class="lien"></button>
  </section>

  <!-- Le compte est sur cet appareil : son wallet, sa protection, et, quand il le faut, l'ajout de cet appareil.
       Le reste est sous « Plus d'options ». -->
  <div id="v-coffre" hidden>
    <section class="card">
      <h2 id="t-c-titre"></h2>
      <p class="muted etiquette" id="t-c-adresse"></p>
      <div class="puce"><span class="adresse" id="adresse-courte"></span><button type="button" id="b-copier-adresse" class="petit"></button></div>
      <div class="status" id="garde"></div>
      <button id="b-doublon" hidden></button>
      <button id="b-renvoyer" hidden></button>
      <div class="status" id="s-coffre"></div>
    </section>
    <section class="card" id="c-protection">
      <h2 id="t-s-titre"></h2>
      <p class="muted" id="secours"></p>
      <button id="b-mission"></button>
      <button id="b-adresses" class="second" hidden></button>
    </section>
    <section class="card" id="c-appareil" hidden>
      <h2 id="t-ap-titre"></h2>
      <p class="muted" id="appareil"></p>
      <button id="b-ajouter" class="second" hidden></button>
      <div class="status" id="s-appareil"></div>
    </section>
    <details class="plus options" id="c-plus">
      <summary id="t-c-plus"></summary>
      <p class="muted" id="t-c-adresse-entiere"></p>
      <p class="adresse" id="adresse"></p>
      <button id="b-reconnecter" class="second"></button>
      <button id="b-ouvrir" class="second"></button>
      <button id="b-oublier" class="second"></button>
      <div class="status" id="s-plus"></div>
    </details>
  </div>

  <section class="card" id="v-adresses" hidden>
    <h2 id="t-ad-titre"></h2>
    <div id="a-liste">
      <p id="t-ad-texte"></p>
      <p class="muted" id="t-ad-note"></p>
      <div class="status" id="a-attente" hidden></div>
      <button id="b-a-terminer" hidden></button>
      <div class="status" id="a-rang-1"></div>
      <button id="b-a-changer-1" class="second"></button>
      <div class="status" id="a-rang-2"></div>
      <button id="b-a-regler-2" class="second"></button>
      <button id="b-a-retirer-2" class="second" hidden></button>
    </div>
    <div id="a-saisie" hidden>
      <p id="a-titre"></p>
      <div id="a-z-adresse">
        <input id="a-adresse" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false">
        <button id="b-a-code"></button>
        <input id="a-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" hidden>
      </div>
      <button id="b-a-enregistrer" hidden></button>
      <button id="b-a-retour" class="second"></button>
    </div>
    <div class="status" id="s-adresses"></div>
    <button id="b-a-fermer" class="lien"></button>
  </section>

  <!-- Protéger son compte : voir les 12 mots, les remettre dans l'ordre, puis donner une adresse e-mail. -->
  <section class="card" id="v-mission" hidden>
    <div id="m-progres" hidden>
      <div class="pas" aria-hidden="true"><i id="m-pas-1"></i><i id="m-pas-2"></i><i id="m-pas-3"></i></div>
      <p class="muted etape" id="m-etape"></p>
    </div>
    <div id="m-intro">
      <h2 id="t-m-titre"></h2>
      <p id="t-m-intro"></p>
      <p class="muted" id="t-m-seul"></p>
      <details class="plus">
        <summary id="t-m-pourquoi-titre"></summary>
        <p class="muted" id="t-m-pourquoi"></p>
      </details>
      <button id="b-m-voir"></button>
    </div>
    <div id="m-mots" hidden>
      <h2 id="t-m-mots-titre"></h2>
      <p class="muted" id="t-m-mots-texte"></p>
      <ol class="mots">
        <li><span>1</span><b id="m-mot-1"></b></li>
        <li><span>2</span><b id="m-mot-2"></b></li>
        <li><span>3</span><b id="m-mot-3"></b></li>
        <li><span>4</span><b id="m-mot-4"></b></li>
        <li><span>5</span><b id="m-mot-5"></b></li>
        <li><span>6</span><b id="m-mot-6"></b></li>
        <li><span>7</span><b id="m-mot-7"></b></li>
        <li><span>8</span><b id="m-mot-8"></b></li>
        <li><span>9</span><b id="m-mot-9"></b></li>
        <li><span>10</span><b id="m-mot-10"></b></li>
        <li><span>11</span><b id="m-mot-11"></b></li>
        <li><span>12</span><b id="m-mot-12"></b></li>
      </ol>
      <button id="b-m-note"></button>
    </div>
    <div id="m-cartes" hidden>
      <h2 id="t-m-cartes-titre"></h2>
      <p class="muted" id="t-m-cartes-texte"></p>
      <ol class="mots">
        <li><span>1</span><b id="m-place-1"></b></li>
        <li><span>2</span><b id="m-place-2"></b></li>
        <li><span>3</span><b id="m-place-3"></b></li>
        <li><span>4</span><b id="m-place-4"></b></li>
        <li><span>5</span><b id="m-place-5"></b></li>
        <li><span>6</span><b id="m-place-6"></b></li>
        <li><span>7</span><b id="m-place-7"></b></li>
        <li><span>8</span><b id="m-place-8"></b></li>
        <li><span>9</span><b id="m-place-9"></b></li>
        <li><span>10</span><b id="m-place-10"></b></li>
        <li><span>11</span><b id="m-place-11"></b></li>
        <li><span>12</span><b id="m-place-12"></b></li>
      </ol>
      <p class="muted" id="m-avance"></p>
      <div class="cartes">
        <button type="button" class="carte" id="m-carte-1"></button>
        <button type="button" class="carte" id="m-carte-2"></button>
        <button type="button" class="carte" id="m-carte-3"></button>
        <button type="button" class="carte" id="m-carte-4"></button>
        <button type="button" class="carte" id="m-carte-5"></button>
        <button type="button" class="carte" id="m-carte-6"></button>
        <button type="button" class="carte" id="m-carte-7"></button>
        <button type="button" class="carte" id="m-carte-8"></button>
        <button type="button" class="carte" id="m-carte-9"></button>
        <button type="button" class="carte" id="m-carte-10"></button>
        <button type="button" class="carte" id="m-carte-11"></button>
        <button type="button" class="carte" id="m-carte-12"></button>
      </div>
      <button id="b-m-valider" disabled></button>
      <button id="b-m-retirer" class="second" disabled></button>
      <button id="b-m-revoir" class="lien"></button>
    </div>
    <div id="m-email" hidden>
      <h2 id="t-m-email-titre"></h2>
      <p class="bon" id="t-m-email-ok"></p>
      <p class="muted" id="t-m-email-texte"></p>
      <div id="m-z-adresse">
        <input id="m-adresse" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false">
        <button id="b-m-code"></button>
        <input id="m-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" hidden>
      </div>
      <button id="b-m-finir" hidden></button>
    </div>
    <div class="status" id="s-mission"></div>
    <button id="b-m-annuler" class="lien"></button>
  </section>

  <!-- Le relevé d'essai : il sert à ceux qui essaient la page et qui le recopient. Il reste en français, lui et ses lignes. -->
  <details class="card essai" id="v-resultat">
    <summary>Pour l'essai : le relevé</summary>
    <button id="b-copier" class="second">Copier le résultat</button>
    <textarea id="resultat" readonly></textarea>
    <div class="status" id="s-resultat"></div>
  </details>
</main>
<script type="module" src="page.mjs"></script>
</body>
</html>
